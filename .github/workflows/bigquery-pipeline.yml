name: 'Manual BigQuery Table Creation'

on:
  workflow_dispatch: 
    inputs:
      environment:
        description: 'Select environment (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  run-bigquery-scripts:
    name: 'Run BigQuery Table Creation Script'
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: bigquery

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v2

      # Authenticate to Google Cloud
      - name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      # Set up Google Cloud SDK
      - name: 'Set up Google Cloud SDK'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Set up Python 3.9
      - name: 'Set up Python 3.9'
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Run the dev.sh script to create BigQuery tables
      - name: 'Run BigQuery Table Creation Script'
        run: |
          if [ "${{ github.event.inputs.environment }}" == "dev" ]; then
            chmod +x dev.sh
            ./dev.sh
          elif [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            chmod +x prod.sh
            ./prod.sh
          fi