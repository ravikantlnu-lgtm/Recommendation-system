# PIPELINE DEFINITION
# Name: tuning-job
# Inputs:
#    base_model: str
#    bucket: str
#    data_output_filename: str
#    epochs: int [Default: 1.0]
#    formatted_data_output_filename: str
#    id_col: str
#    labels: list [Default: ['very high', 'high', 'moderate', 'low', 'not relevant']]
#    location: str
#    model_display_name: str
#    project_details_col: list
#    project_id: str
#    prompt: str
#    prompt_type: str [Default: 'parts']
#    query_col: str
#    response_col: str
#    search_col: str
#    seed: int [Default: 42.0]
#    training_split: float [Default: 0.8]
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        X_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        base_model:
          parameterType: STRING
        bucket:
          parameterType: STRING
        id_col:
          parameterType: STRING
        labels:
          parameterType: LIST
        location:
          parameterType: STRING
        project_id:
          parameterType: STRING
        prompt:
          parameterType: STRING
        prompt_type:
          parameterType: STRING
        query_col:
          parameterType: STRING
        response_col:
          parameterType: STRING
        search_col:
          parameterType: STRING
        tuned_model_endpoint:
          parameterType: STRING
    outputDefinitions:
      parameters:
        base_model:
          parameterType: STRING
        f1_scores:
          parameterType: STRUCT
        tuned_model_endpoint:
          parameterType: STRING
