            prompt:
              componentInputParameter: prompt
            prompt_type:
              componentInputParameter: prompt_type
            query_col:
              componentInputParameter: query_col
            response_col:
              componentInputParameter: response_col
            search_col:
              componentInputParameter: search_col
            tuned_model_endpoint:
              componentInputParameter: tuned_model_endpoint
        taskInfo:
          name: evaluate-model
  inputDefinitions:
    artifacts:
      X_test:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      y_test:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
    parameters:
      base_model:
        parameterType: STRING
      bucket:
        parameterType: STRING
      id_col:
        parameterType: STRING
      labels:
        parameterType: LIST
      location:
        parameterType: STRING
      project_id:
        parameterType: STRING
      prompt:
        parameterType: STRING
      prompt_type:
        parameterType: STRING
      query_col:
        parameterType: STRING
      response_col:
        parameterType: STRING
      search_col:
        parameterType: STRING
      tuned_model_endpoint:
        parameterType: STRING
  outputDefinitions:
    parameters:
      base_model:
        parameterType: STRING
      f1_scores:
        parameterType: STRUCT
      tuned_model_endpoint:
        parameterType: STRING
