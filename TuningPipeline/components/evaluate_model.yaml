  dag:
    outputs:
      parameters:
        base_model:
          valueFromParameter:
            outputParameterKey: base_model
            producerSubtask: evaluate-model
        f1_scores:
          valueFromParameter:
            outputParameterKey: f1_scores
            producerSubtask: evaluate-model
        tuned_model_endpoint:
          valueFromParameter:
            outputParameterKey: tuned_model_endpoint
            producerSubtask: evaluate-model
    tasks:
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        inputs:
          artifacts:
            X_test:
              componentInputArtifact: X_test
            y_test:
              componentInputArtifact: y_test
          parameters:
            base_model:
              componentInputParameter: base_model
            bucket:
